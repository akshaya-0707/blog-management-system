{% extends 'base.html' %}

{% block content %}

<h2>Search Results for "{{ query }}"</h2>

{% for post in posts %}
<div class="card mb-3">
    <div class="card-body">
        <h3>{{ post.title }}</h3>
        <p>{{ post.content[:100] }}</p>

        <a href="{{ url_for('view_post', post_id=post.id) }}" class="btn btn-primary">
            Read More
        </a>
    </div>
</div>
{% endfor %}

{% endblock %}
