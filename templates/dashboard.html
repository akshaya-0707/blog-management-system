{% extends 'base.html' %}

{% block content %}

<h2>Your Dashboard</h2>

<a href="{{ url_for('create_post') }}" class="btn btn-success mb-3">Create New Post</a>

{% for post in posts %}
<div class="card mb-3">
    <div class="card-body">
        <h3>{{ post.title }}</h3>

        <a href="{{ url_for('edit_post', post_id=post.id) }}" class="btn btn-warning">Edit</a>

        <a href="{{ url_for('delete_post', post_id=post.id) }}" class="btn btn-danger">Delete</a>
    </div>
</div>
{% endfor %}

{% endblock %}
